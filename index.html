<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Directory</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <header>
    <h1>Active Directory Simulator</h1>
    <!-- type="search": el navegador agrega un botón para borrar el texto -->
    <input type="search" id="buscador" placeholder="Buscar usuarios, grupos o equipos..." aria-label="Buscar en el dominio">
</header>
    <main class="layout">
        <!-- Zona 1: árbol del dominio. JS va a dibujar acá las OUs y containers -->
        <nav id="arbol" aria-label="Árbol del dominio">
            <h2>Arbol</h2>
            
            
        </nav>
        <!-- Zona 2: listaa de objetos de lo que se seleccione en el árbol -->
        <section id="lista">
            <h2>Objetos</h2>
            <p>Usuarios, grupos y equipos</p>
        </section>
        <!-- Zona 3: propiedades del objeto seleccionado y botones de acción -->
        <aside id="detalles">
            <h2>Detalles</h2>
            <p>Seleccioná un objeto</p>
        </aside>
    </main>

        <!-- Modal de restablecer contraseña (lo abre JS con showModal) -->
    <dialog id="modal-contrasena" aria-labelledby="titulo-modal">
    <!-- novalidate: la validación la hacemos nosotros en JS -->
    <form id="form-contrasena" novalidate>
        <h2 id="titulo-modal">Restablecer contraseña</h2>
        <p id="modal-usuario"></p>

        <label for="contrasena-nueva">Nueva contraseña</label>
        <input type="password" id="contrasena-nueva" name="nueva" autocomplete="new-password">

        <label for="contrasena-confirmar">Confirmar contraseña</label>
        <input type="password" id="contrasena-confirmar" name="confirmar" autocomplete="new-password">

        <label class="opcion">
        <input type="checkbox" id="debe-cambiar" name="debeCambiar" checked>
        El usuario debe cambiarla en el próximo inicio de sesión
        </label>
        <label class="opcion">
        <input type="checkbox" id="desbloquear" name="desbloquear">
        Desbloquear la cuenta
        </label>

        <!-- role="alert": los lectores de pantalla anuncian el error al aparecer -->
        <p id="error-contrasena" role="alert"></p>

        <div class="acciones-modal">
        <button type="button" id="cancelar-contrasena">Cancelar</button>
        <button type="submit">Aceptar</button>
        </div>
    </form>
    </dialog>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
